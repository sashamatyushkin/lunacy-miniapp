    <!-- Loaded before the bundle so expand()/requestFullscreen() run on the first frame. -->

    <script>
      // Fullscreen must be requested as early as possible, otherwise Telegram
      // paints its own header strip for a few hundred ms.
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        tg.ready();
        tg.expand();
        // Fullscreen and swipe control arrived in Bot API 8.0 / 7.7. Calling them
        // on an older client only prints an SDK error, so gate on the version.
        var v = parseFloat(tg.version || '6.0');
        if (v >= 8) { try { tg.requestFullscreen(); } catch (e) {} }
        if (v >= 7.7) { try { tg.disableVerticalSwipes(); } catch (e) {} }
        try { tg.setHeaderColor && tg.setHeaderColor('#0e0e0e'); } catch (e) {}
        try { tg.setBackgroundColor && tg.setBackgroundColor('#0e0e0e'); } catch (e) {}
        try { tg.setBottomBarColor && tg.setBottomBarColor('#0e0e0e'); } catch (e) {}
      })();
    </script>
